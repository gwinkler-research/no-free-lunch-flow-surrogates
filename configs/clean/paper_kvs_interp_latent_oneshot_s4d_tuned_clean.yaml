# KVS interp, S4D-branch one-shot row (latent x one-shot), seeds 1-3.
# Encoder: interp ConvAE from paper_kvs_interp_convae_83x442_clean.yaml (suffix = weight hash).
# A branch over (theta, ramp) and a trunk over t give the latent trajectory z(t) in one pass,
# without autoregressive feedback. Hyperparameters from a search on the validation latent MSE.
dataset: kvs
split: interp
adapter: latent_oneshot
model_name: latent_oneshot_s4d_tuned_clean
branch_type: s4d
encoder_ref: results/benchmark/encoders_clean/kvs_interp_convae_83x442_bc32_47132e7b07.pt
chunk_roots:
- results/refined_4x_2026-05-07/chunk_01
- results/refined_4x_2026-05-07/chunk_02
- results/refined_4x_2026-05-07/chunk_03
- results/refined_4x_2026-05-07/chunk_04_20260509_220406
mesh_npz: meshes/refined_4x/mesh.npz
grid_hw:
- 83
- 442
raster_cache: results/benchmark/cache/kvs_grid_83x442.npz
model:
  basis_dim: 64
  branch_width: 96
  branch_n_layers: 3
  branch_d_state: 32
  dt_min: 0.0001
  dt_max: 0.01
  trunk_width: 384
  trunk_depth: 5
  epochs: 2000
  batch_size: 32
  lr: 0.001978973182052078
  weight_decay: 2.9985344505225096e-06
  spectral_loss_lambda: 0.0
  val_every: 25
  early_stop_patience: 300
  device: auto
require_h5: false
