# CMP film interp, Mamba-branch DeepONet row (latent x AR), seeds 1-3.
# Encoder: frozen POD of the interp train split, built by scripts/build_cmp3d_pod.py.
# Of its 139 stored modes the first pod_k = 8 are used.
# Same curriculum for all four latent AR rows: rollout from 1 to 50 steps (300 epochs at one
# step, then a 300-epoch ramp), variance penalty 0.3 once the rollout reaches five steps.
# One optimiser step per epoch on batch_size random training cases. best.pt: validation
# rollout MSE, checked every 25 epochs from epoch 700 on.
# Mamba branch as in the KVS Mamba row.
dataset: cmp3d
split: interp
adapter: cmp3d_latent_ar
model_name: cmp3d_latent_ar_mamba_k8_fix
cmp3d_npz: data/cmp/cmp3d_full100fix_fem_training.npz
cmp3d_encoder_ref: results/benchmark/encoders/cmp3d_interp_pod139_fix.npz
pod_k: 8
dynamics_kind: mamba_branch_don
model:
  branch_width: 128
  branch_n_layers: 4
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  trunk_width: 512
  trunk_depth: 5
  basis_dim: 128
  epochs: 2000
  batch_size: 64
  lr: 2.5e-4
  weight_decay: 1.0e-4
  rollout_max_phase1: 50
  rollout_warmup_phase1: 300
  rollout_ramp_phase1: 300
  var_lambda_phase1: 0.3
  grad_clip_phase1: 0.25
  best_mature_epoch_phase1: 700
  device: auto
