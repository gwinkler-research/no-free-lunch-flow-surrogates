# CMP film interp, S4D-branch one-shot row (latent x one-shot), seeds 1-3.
# Encoder: frozen POD of the interp train split, built by scripts/build_cmp3d_pod.py.
# Of its 139 stored modes the first pod_k = 8 are used.
# A branch over (theta, ramp) and a trunk over t give the latent trajectory z(t) in one pass,
# without autoregressive feedback. Hyperparameters from a search on the validation latent MSE.
dataset: cmp3d
split: interp
adapter: cmp3d_latent_oneshot
model_name: cmp3d_latent_oneshot_s4d_tuned_fix
branch_type: s4d
cmp3d_npz: data/cmp/cmp3d_full100fix_fem_training.npz
cmp3d_encoder_ref: results/benchmark/encoders/cmp3d_interp_pod139_fix.npz
pod_k: 8
model:
  basis_dim: 64
  branch_width: 96
  branch_n_layers: 4
  branch_d_state: 64
  dt_min: 0.0001
  dt_max: 0.01
  trunk_width: 384
  trunk_depth: 5
  epochs: 2000
  batch_size: 32
  lr: 0.00034878527126234907
  weight_decay: 1.8096039818770814e-06
  spectral_loss_lambda: 0.0
  val_every: 25
  early_stop_patience: 300
  device: auto
